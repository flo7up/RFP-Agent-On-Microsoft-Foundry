# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: opportunity-assessment-agent
services:
    agent-ai-serviceshf3u-project:
        host: azure.ai.project
        endpoint: https://agent-ai-serviceshf3u.services.ai.azure.com/api/projects/agent-ai-serviceshf3u-project
    opportunity-proposal-agent:
        project: .
        host: azure.ai.agent
        language: python
        startupCommand: python kickoffdemos/03_patterns.py
        description: Creates cited SI proposals from matched opportunities and linked historical proposals.
        metadata:
            tags:
                - Agent Framework
                - Foundry IQ
                - Hybrid Retrieval
                - Responses Protocol
        uses:
            - agent-ai-serviceshf3u-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: kickoffdemos/03_patterns.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        kind: hosted
        name: opportunity-proposal-agent
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: AZURE_AI_SEARCH_CONNECTION_NAME
              value: ${AZURE_AI_SEARCH_CONNECTION_NAME}
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
