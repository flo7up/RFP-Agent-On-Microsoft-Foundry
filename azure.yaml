# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: rfp-agent-on-msfoundry
services:
    ai-project:
        host: azure.ai.project
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
    opportunity-proposal-agent:
        project: .
        host: azure.ai.agent
        language: python
        startupCommand: python kickoffdemos/hosted_proposal_agent.py
        description: Creates cited SI proposals from matched opportunities and linked historical proposals.
        metadata:
            tags:
                - Agent Framework
                - Foundry IQ
                - Hybrid Retrieval
                - Responses Protocol
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: kickoffdemos/hosted_proposal_agent.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        kind: hosted
        name: opportunity-proposal-agent
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: AZURE_AI_SEARCH_CONNECTION_NAME
              value: ${AZURE_AI_SEARCH_CONNECTION_NAME}
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
