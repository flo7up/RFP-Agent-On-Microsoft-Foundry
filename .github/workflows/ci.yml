name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline contracts
        run: python -B -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q kickoffdemos tests

      - name: Validate playground JavaScript
        run: node --check kickoffdemos/harness_playground_assets/playground.js
